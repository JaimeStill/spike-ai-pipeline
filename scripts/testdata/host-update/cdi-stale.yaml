# The same excerpt as generated for driver 580.95.05, left behind by an upgrade to 580.178.04.
---
cdiVersion: 0.7.0
kind: nvidia.com/gpu
devices:
    - name: "0"
      containerEdits:
        deviceNodes:
            - path: /dev/nvidia0
              major: 195
              fileMode: 438
              permissions: rwm
        hooks:
            - hookName: createContainer
              path: /usr/bin/nvidia-cdi-hook
              args:
                - nvidia-cdi-hook
                - create-symlinks
containerEdits:
    env:
        - NVIDIA_VISIBLE_DEVICES=void
    mounts:
        - hostPath: /run/nvidia-persistenced/socket
          containerPath: /run/nvidia-persistenced/socket
          options:
            - ro
        - hostPath: /usr/bin/nvidia-smi
          containerPath: /usr/bin/nvidia-smi
          options:
            - ro
        - hostPath: /usr/lib/aarch64-linux-gnu/libcuda.so.580.95.05
          containerPath: /usr/lib/aarch64-linux-gnu/libcuda.so.580.95.05
          options:
            - ro
        - hostPath: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.580.95.05
          containerPath: /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.580.95.05
          options:
            - ro
        - hostPath: /usr/lib/aarch64-linux-gnu/libnvidia-egl-wayland.so.1.1.23
          containerPath: /usr/lib/aarch64-linux-gnu/libnvidia-egl-wayland.so.1.1.23
          options:
            - ro
        - hostPath: /usr/lib/aarch64-linux-gnu/libnvidia-nvvm70.so.4
          containerPath: /usr/lib/aarch64-linux-gnu/libnvidia-nvvm70.so.4
          options:
            - ro
        - hostPath: /lib/firmware/nvidia/580.95.05/gsp_ga10x.bin
          containerPath: /lib/firmware/nvidia/580.95.05/gsp_ga10x.bin
          options:
            - ro
