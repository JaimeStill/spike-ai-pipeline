; The llama.cpp router's models preset for gb10-2: set A, bind-mounted read-only into the llama
; container at /etc/llama-preset/models.ini by the copied engines/llama.sh, which finds it at
; llama-preset/models.ini beside itself. Each section is a model the router lists, named as
; clients name it in "model"; its keys are llama-server arguments without the leading dashes.
;
; The values are spike-model-hosting's set A startup values (devices/strix-halo/profile.toml,
; rendered in hosting/profile/testdata/strix-halo.ini), whose reasons that profile gives, not the
; swept ones: sizing set A for gb10-2 is spike-model-layout's. Two keys differ from that render:
; no model sets load-on-startup, since the router runs --no-models-autoload (engines/llama.sh)
; and `mise run host-update` loads set A through the load API; and [*] adds the engines preset's
; GB10 keys, n-gpu-layers = all and dedup-cache-models. The embedding model is the exception:
; that profile's is EmbeddingGemma 2, which set A no longer serves, so the section for
; granite-embedding-english-r2 takes its model-level keys from spike-model-engines' preset, as
; that section says.
;
; Each hf-repo resolves in /srv/models, the Hugging Face cache the router reads (LLAMA_CACHE),
; where hf stages the files beforehand, so a load downloads nothing.

[*]
; The official embedded chat template.
jinja = true
; Every model's layers on the GB10's GPU.
n-gpu-layers = all
; The default for a model pulled ad hoc; every set A model sets its own c.
c = 32768
; Serve /metrics, the Prometheus counters.
metrics = true
; Makes the 32-checkpoint budget's reach (32 x 4096) match gpt-oss-120b's c.
checkpoint-min-step = 4096
; One KV pool for each model, its slots sharing it.
kv-unified = true
; When a preset's hf-repo is already in the store, list the preset alone, not its cache entry too.
dedup-cache-models = true

; OpenAI's gpt-oss-120b in its native MXFP4, the harness model. Card:
; https://huggingface.co/openai/gpt-oss-120b. c is its trained context, shared by 4 slots.
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0,
; top_p 1.0; top-k = 0 and min-p = 0 turn off the server's two other truncations.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
parallel = 4
temp = 1
top-p = 1
top-k = 0
min-p = 0

; Google's Gemma 4 26B-A4B, ggml-org's Q4_0, the vision model; the router loads its Q8_0 mmproj
; beside it. Card: https://huggingface.co/google/gemma-4-26B-A4B-it. mtmd-batch-max-tokens = 512
; encodes each image in a batch of its own, so the image encoder's compute buffer stays at the
; single-image level. Sampling from the card, "1. Sampling Parameters": temperature 1.0, top_p
; 0.95, top_k 64; min-p = 0 since the card names none.
[ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0]
hf-repo = ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0
c = 32768
parallel = 4
mtmd-batch-max-tokens = 512
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Google's Gemma 4 E4B, Q8_0, the audio model; the router loads its Q8_0 mmproj beside it, which
; carries the audio encoder. Card: https://huggingface.co/google/gemma-4-E4B-it. Sampling from the
; card, "1. Sampling Parameters": temperature 1.0, top_p 0.95, top_k 64; min-p = 0 since the card
; names none.
[ggml-org/gemma-4-E4B-it-GGUF:Q8_0]
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q8_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; IBM's granite-embedding-english-r2, BF16, Apache-2.0: text embeddings only, from a ModernBERT
; encoder, 768 dimensions. Card: https://huggingface.co/ibm-granite/granite-embedding-english-r2.
; It replaced EmbeddingGemma 2, which vLLM can't serve on the GB10, since set A has to serve on
; both engines. IBM publishes no GGUF of it, so the section names a conversion of IBM's weights:
; BF16, the same weights vLLM serves; the quantization BF16 picks
; granite-embedding-english-r2-bf16.gguf, and the repository has no projector. Its GGUF declares
; CLS pooling, as the card's sentence-transformers config does, so no pooling key overrides it.
; c gives each of the 4 slots 8192 tokens, its trained context. b and ub are a whole slot, since an
; embedding input has to fit in one physical batch. The model-level keys follow spike-model-engines'
; section for it (engines/llama-preset/models.ini at 08a1df9). No sampling: an embedding model
; doesn't sample.
[mrutkows/granite-embedding-english-r2-GGUF:BF16]
hf-repo = mrutkows/granite-embedding-english-r2-GGUF:BF16
c = 32768
parallel = 4
b = 8192
ub = 8192
embeddings = true
