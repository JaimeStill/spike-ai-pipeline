# The download tool the root runs on gb10-2, hf, Hugging Face's command line, and the runtime it
# needs. It stages set A's models into the shared store (/srv/models) before the router loads
# them. It lives in its own environment, not mise.toml, so the hermetic `mise run check` never
# installs it, and it needs no root. Activate it with MISE_ENV=host, from the clone on gb10-2:
# `MISE_ENV=host mise install`, then `MISE_ENV=host mise exec -- hf download <repo>`.
# spike-model-engines pins the same two (its mise.host.toml).
[tools]
# mise's pipx backend installs huggingface_hub, which provides `hf`, through uv.
uv = "0.13.6"
"pipx:huggingface_hub" = "2.3.0"
